[project]
name = "unit-converter"
version = "0.1.0"
description = "A simple cli tool to convert between different units of measurement."
authors = [{ name = "iamwatchdogs", email = "shamith301102@gmail.com" }]
readme = "README.md"
license = { text = "MIT" }
requires-python = ">=3.13"
dependencies = []

[project.scripts]
unit-converter = "unit_converter.main:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[dependency-groups]
dev = [
    "mypy>=1.20.2",
    "pre-commit>=4.6.0",
    "pytest>=9.0.3",
    "pytest-cov>=7.1.0",
    "pytest-testmon>=2.2.0",
    "pytest-xdist>=3.8.0",
    "ruff>=0.15.12",
]

[tool.mypy]
python_version = "3.13"
strict = true
warn_return_any = true
warn_unused_configs = true
mypy_path = "src"
packages = ["unit_converter"]

[tool.ruff]
target-version = "py313"
line-length = 88
src = ["src"]

[tool.ruff.lint]
select = [
    "E",   # pycodestyle errors
    "F",   # pyflakes
    "I",   # isort
    "UP",  # pyupgrade — modernise syntax automatically
    "ANN", # flake8-annotations — enforces type hints (needed for Mypyc)
    "B",   # flake8-bugbear — catches common bugs
    "SIM", # flake8-simplify
    "RUF", # ruff-specific rules
]

[tool.ruff.format]
quote-style = "double"
indent-style = "space"

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
addopts = "--cov=unit_converter --cov-report=term-missing -v -n auto"
